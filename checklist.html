.rituals li span { color: var(--soft); font-size: .92rem; margin-left: 6px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.btn { font: 600 .95rem/1 var(--f-body); padding: 13px 18px; border-radius: 12px; border: 2px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }

          var id = st.id + "-" + i;
          return '<li><label for="c-' + id + '"><input type="checkbox" id="c-' + id + '" data-id="' + id + '"' + (ticks[id] ? " checked" : "") + "><span>" + esc(it[lang]) +
            (it.note ? "<small>" + esc(it.note[lang]) + "</small>" : "") + "</span></label></li>";
        }).join("") + "</ul>" +
        (st.invite ? '<p class="cta">' + esc(T[lang].invite) + ' <a href="index.html#demos">' + esc(T[lang].inviteLink) + " →</a></p>" : "") + "</section>";
    }).join("");
    document.getElementById("rituals").innerHTML = R.map(function (r) {
      return "<li><div><b>" + r[0] + "</b>" + (lang === "en" ? "<span>" + r[1] + "</span>" : "") + "</div></li>";
    }).join("");
    document.querySelectorAll("#stages input").forEach(function (cb) {
      cb.addEventListener("change", function () { if (cb.checked) ticks[cb.getAttribute("data-id")] = 1; else delete ticks[cb.getAttribute("data-id")]; save(); progress(); });
    });
    progress();
  }
  function progress() {
    var total = 0; S.forEach(function (s) { total += s.items.length; });
    var done = Object.keys(ticks).length;
    document.getElementById("bar").style.width = Math.round(done / total * 100) + "%";
    document.getElementById("count").textContent = bnNum(done) + " / " + bnNum(total) + " " + T[lang].done;
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { lang = b.getAttribute("data-lang"); try { localStorage.setItem(KEY + "-lang", lang); localStorage.setItem("nimontron-lang", lang); } catch (e) {} render(); });
  });
  document.getElementById("reset").addEventListener("click", function () { ticks = {}; save(); render(); msg(T[lang].cleared); });
  document.getElementById("copy").addEventListener("click", function () {
    var txt = T[lang].title + "\n\n" + S.map(function (st) {
      return st.when[lang] + ": " + st.title[lang] + "\n" + st.items.map(function (it, i) { return (ticks[st.id + "-" + i] ? "✅ " : "⬜ ") + it[lang]; }).join("\n");
    }).join("\n\n") + "\n\n" + location.href.split("#")[0];
    var ok = function () { msg(T[lang].copied); };
    try { navigator.clipboard.writeText(txt).then(ok, function () { fallback(txt); }); } catch (e) { fallback(txt); }
  });
  function fallback(txt) {
    var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); msg(T[lang].copied); } catch (e) {} ta.remove();
  }
  function msg(m) { var el = document.getElementById("msg"); el.textContent = m; setTimeout(function () { el.textContent = T[lang].saveNote; }, 3000); }
  render();
})();
</script>
</body>
</html>
